name: Verify
on:
  push:
    branches: [main, 'david/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B -ntp verify
      - name: PostgreSQL integration tests
        run: ./mvnw -B -ntp -Pintegration test-compile failsafe:integration-test failsafe:verify
      - name: Build standalone Docker image
        run: docker build --tag psi-billing-service:ci .
