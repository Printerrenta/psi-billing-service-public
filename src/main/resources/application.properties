server.port=${PORT:8080}
server.shutdown=graceful
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-numbers-for-enums=true
spring.jackson.deserialization.accept-float-as-int=false
spring.application.name=billing-service
DB_SCHEMA=${SERVICE_SCHEMA:billing}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rental}
spring.datasource.username=${DB_USERNAME:rental}
spring.datasource.password=${DB_PASSWORD:rental_local}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.flyway.url=${DB_MIGRATION_URL:${spring.datasource.url}}
spring.flyway.user=${DB_MIGRATION_USERNAME:${spring.datasource.username}}
spring.flyway.password=${DB_MIGRATION_PASSWORD:${spring.datasource.password}}
spring.flyway.schemas=${DB_SCHEMA}
spring.flyway.default-schema=${DB_SCHEMA}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

app.business-zone=Europe/Vilnius
